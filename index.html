function getCutMasterBus(ctx) {
  if (_cutMasterGain && _cutMasterGain.context === ctx) return _cutMasterGain;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.75, ctx.currentTime);
  g.connect(ctx.destination);
  _cutMasterGain = g;
  return g;
}

function getGlassClickBuffer(ctx) {
  if (_glassClickBuf && _glassClickBuf.sampleRate === ctx.sampleRate) return _glassClickBuf;
  const len = Math.floor(ctx.sampleRate * 0.012);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.34));
  }
  _glassClickBuf = buf;
  return buf;
}

function playGlassyMetallicNote(ctx, freq, startTime) {
  const bus = getCutMasterBus(ctx);
  const dur = 0.30; // Your exact sound decay untouched

  // 1. Your Exact Hollow Air-Tube Cavity Resonator
  const airSrc = ctx.createBufferSource();
  airSrc.buffer = getGlassClickBuffer(ctx);

  const tubeCavity = ctx.createBiquadFilter();
  tubeCavity.type = "bandpass";
  tubeCavity.frequency.setValueAtTime(freq, startTime);
  tubeCavity.Q.value = 21.0;

  const airGain = ctx.createGain();
  airGain.gain.setValueAtTime(0.56, startTime);
  airGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.14);

  airSrc.connect(tubeCavity);
  tubeCavity.connect(airGain);
  airGain.connect(bus);
  airSrc.start(startTime);

  // 2. Your Exact 5-Layer Unison Glass Tube Core
  const detunes = new Array(-2.8, -1.4, 0, 1.4, 2.8);
  for (let d = 0; d < detunes.length; d++) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq + detunes[d], startTime);

    const peak = d === 2 ? 0.17 : 0.115;
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.linearRampToValueAtTime(peak, startTime + 0.0012);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);

    osc.connect(gain);
    gain.connect(bus);
    osc.start(startTime);
    osc.stop(startTime + dur + 0.02);
  }

  // 3. Your Exact Open Air-Column Pipe Harmonics (2.0x & 3.0x)
  const pipe2Osc = ctx.createOscillator();
  const pipe2Gain = ctx.createGain();
  pipe2Osc.type = "sine";
  pipe2Osc.frequency.setValueAtTime(freq * 2.0, startTime);

  pipe2Gain.gain.setValueAtTime(0.0001, startTime);
  pipe2Gain.gain.linearRampToValueAtTime(0.10, startTime + 0.0012);
  pipe2Gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.18);

  pipe2Osc.connect(pipe2Gain);
  pipe2Gain.connect(bus);
  pipe2Osc.start(startTime);
  pipe2Osc.stop(startTime + 0.20);

  const pipe3Osc = ctx.createOscillator();
  const pipe3Gain = ctx.createGain();
  pipe3Osc.type = "sine";
  pipe3Osc.frequency.setValueAtTime(freq * 3.0, startTime);

  pipe3Gain.gain.setValueAtTime(0.0001, startTime);
  pipe3Gain.gain.linearRampToValueAtTime(0.022, startTime + 0.001);
  pipe3Gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.11);

  pipe3Osc.connect(pipe3Gain);
  pipe3Gain.connect(bus);
  pipe3Osc.start(startTime);
  pipe3Osc.stop(startTime + 0.13);

  // 4. Your Exact Glass Wall Ring Mode (2.756x)
  const wallOsc = ctx.createOscillator();
  const wallGain = ctx.createGain();
  wallOsc.type = "sine";
  wallOsc.frequency.setValueAtTime(freq * 2.756, startTime);

  wallGain.gain.setValueAtTime(0.0001, startTime);
  wallGain.gain.linearRampToValueAtTime(0.044, startTime + 0.001);
  wallGain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.13);

  wallOsc.connect(wallGain);
  wallGain.connect(bus);
  wallOsc.start(startTime);
  wallOsc.stop(startTime + 0.15);

  // 5. Your Exact Rounded Glass Tube Rim Tap
  const pingSrc = ctx.createBufferSource();
  pingSrc.buffer = getGlassClickBuffer(ctx);

  const pingFilter = ctx.createBiquadFilter();
  pingFilter.type = "bandpass";
  pingFilter.frequency.setValueAtTime(Math.min(freq * 2.8, 3500), startTime);
  pingFilter.Q.value = 6.5;

  const pingGain = ctx.createGain();
  pingGain.gain.setValueAtTime(0.12, startTime);
  pingGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.006);

  pingSrc.connect(pingFilter);
  pingFilter.connect(pingGain);
  pingGain.connect(bus);
  pingSrc.start(startTime);
}

function playCrispCutSound(ballIndex) {
  const ctx = window.audioCtx || (typeof audioCtx !== "undefined" ? audioCtx : null);
  if (!ctx) return;
  if (ctx.state === "suspended") ctx.resume().catch(() => {});

  const now = ctx.currentTime;
  if (typeof lastCutSoundTime !== "undefined" && now - lastCutSoundTime < 0.18) return;
  if (typeof lastCutSoundTime !== "undefined") lastCutSoundTime = now;

  // Keeps all 5 notes natural (0.00s - 0.23s), then smoothly mutes lingering after-tail (0.23s -> 0.27s)
  const bus = getCutMasterBus(ctx);
  bus.gain.cancelScheduledValues(now);
  bus.gain.setValueAtTime(0.75, now);
  bus.gain.setValueAtTime(0.75, now + 0.23);
  bus.gain.linearRampToValueAtTime(0.0001, now + 0.27);

  // First 4 balls (0, 1, 2, 3) -> Group A (Variations 1-5)
  // Balance 2 balls (4, 5) -> Group B (Variations 6-10)
  const isGroupB = typeof ballIndex === "number" && (ballIndex % 6) >= 4;
  let phrase;

  if (!isGroupB) {
    phrase = GLASS_METAL_VARIATIONS[_groupAVarIdx % 5];
    _groupAVarIdx++;
  } else {
    phrase = GLASS_METAL_VARIATIONS[5 + (_groupBVarIdx % 5)];
    _groupBVarIdx++;
  }

  for (let i = 0; i < phrase.length; i++) {
    playGlassyMetallicNote(ctx, phrase[i].f, now + phrase[i].t);
  }
}

async function connectYouTubeLive() {
  const apiKey = document.getElementById("api-key-input").value.trim();
  const videoId = document.getElementById("video-id-input").value.trim();
  const log = document.getElementById("yt-log");
  if (!apiKey || !videoId) { log.textContent = "Enter both API Key and Video ID."; return; }

  }

async function pollYouTubeChat(apiKey) {
  try {
    let url = `https://googleapis.com{ytLiveChatId}&part=snippet,authorDetails&key=${apiKey}`;
    if (ytNextPageToken) url += `&pageToken=${ytNextPageToken}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.items) {
      for (const item of data.items) {
        registerVote(item.authorDetails?.displayName || "Viewer", item.snippet?.displayMessage || "");
      }
      ytNextPageToken = data.nextPageToken || ytNextPageToken;
    }
    ytPollTimer = setTimeout(() => pollYouTubeChat(apiKey), Math.max(data.pollingIntervalMillis || 2500, 2000));
  } catch (e) {
    ytPollTimer = setTimeout(() => pollYouTubeChat(apiKey), 4000);
  }
}

(function listenToTermux() {
  let activeWs = null;
  let reconnectTimer = null;
  function updateDot(connected) {
    const dot = document.getElementById("termux-dot");
    if (!dot) return;
    dot.style.background = connected ? "#22c55e" : "#ef4444";
    dot.style.boxShadow = connected ? "0 0 8px #22c55e" : "0 0 8px #ef4444";
  }
  function connect() {
    clearTimeout(reconnectTimer);
    if (activeWs && (activeWs.readyState === WebSocket.OPEN || activeWs.readyState === WebSocket.CONNECTING)) return;
    try {
      const ws = new WebSocket("ws://127.0.0.1:8765");
      activeWs = ws;
      ws.onopen = () => {
        if (activeWs === ws) updateDot(true);
      };
      ws.onmessage = (e) => {
        if (activeWs === ws) updateDot(true);
        try {
          const data = JSON.parse(e.data);
          const user = data.user || "Viewer";
          const text = data.message || "";
          if (text) registerVote(user, text);
        } catch (err) {
          if (typeof e.data === "string" && e.data.trim()) {
            registerVote("Viewer", e.data.trim());
          }
        }
      };
      ws.onclose = () => {
        if (activeWs === ws) {
          activeWs = null;
          updateDot(false);
          clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(connect, 1500);
        }
      };
      ws.onerror = () => ws.close();
    } catch (err) {
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, 1500);
    }
  }
  connect();
})();

const dominantColorCache = new Map();

function getDominantFlagColor(country) {
  if (dominantColorCache.has(country.code)) {
    return dominantColorCache.get(country.code);
  }
  try {
    const c = document.createElement("canvas");
    c.width = 32;
    c.height = 32;
    const x = c.getContext("2d");
    x.font = "26px Arial";
    x.textAlign = "center";
    x.textBaseline = "middle";
    x.fillText(country.flag, 16, 17);

    const data = x.getImageData(0, 0, 32, 32).data;
    const counts = new Map();
    let bestHex = country.color;
    let maxCount = 0;

    for (let i = 0; i < data.length; i += 4) {
      const r = data.at(i);
      const g = data.at(i + 1);
      const b = data.at(i + 2);
      const a = data.at(i + 3);
      if (a < 180) continue;
      // Skip pure white and pure black so the most-used flag color stands out on the dark arena
      if (r > 230 && g > 230 && b > 230) continue;
      if (r < 30 && g < 30 && b < 30) continue;

      const qr = Math.round(r / 16) * 16;
      const qg = Math.round(g / 16) * 16;
      const qb = Math.round(b / 16) * 16;
      const key = `${qr},${qg},${qb}`;
      const next = (counts.get(key) || 0) + 1;
      counts.set(key, next);

      if (next > maxCount) {
        maxCount = next;
        bestHex = `rgb(${Math.min(255, r)}, ${Math.min(255, g)}, ${Math.min(255, b)})`;
      }
    }
    dominantColorCache.set(country.code, bestHex);
    return bestHex;
  } catch (e) {
    return country.color;
  }
}

function playSwordClash() {
  // Realistic metallic 2-sword clash + ring sound using Web Audio
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!playSwordClash.ctx) playSwordClash.ctx = new AudioCtx();
    const ctx = playSwordClash.ctx;
    if (ctx.state === "suspended") ctx.resume();

    const now = ctx.currentTime;
    // Metallic noise burst (blades hitting)
    const bufferSize = ctx.sampleRate * 0.25;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.04));
    }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.setValueAtTime(3200, now);
    filter.Q.setValueAtTime(4.5, now);

    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.55, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

    noise.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(ctx.destination);
    noise.start(now);

    // High steel blade ring shimmer
    [2480, 3720, 5140].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.96, now + 0.65);
      gain.gain.setValueAtTime(0.14 / (i + 1), now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.65);
    });
  } catch (e) {}
}

function animateTop6FlagsToArena(top6Countries, onComplete) {

  const flyers = top6Countries.map((country, idx) => {
    const count = top6Countries.length;
    const centerA = (idx / count) * Math.PI * 2 + Math.PI / count;
    const spawnR = ARENA_R * 0.62;
    const targetX = CX + Math.cos(centerA) * spawnR;
    const targetY = CY + Math.sin(centerA) * spawnR;

       let startX = CX + (idx - 2.5) * 32;
    let startY = CY + ARENA_R - 4;
    if (voteIcons[idx]) {
      const r = voteIcons[idx].getBoundingClientRect();
      startX = r.left + r.width / 2 - rect.left;
    }


    return {
      country,
      color: country.color || NEON_PALETTE[idx % NEON_PALETTE.length],
      startX, startY,
      targetX, targetY,
      x: startX, y: startY,
      r: 7
    };
  });

  window.flyingVoteFlags = flyers;
  const startTime = performance.now();
  const duration = 1150;

  function stepFly(now) {
    const t = Math.min(1, (now - startTime) / duration);
    const ease = 1 - Math.pow(1 - t, 3);

    flyers.forEach(fl => {
      fl.x = fl.startX + (fl.targetX - fl.startX) * ease;
      fl.y = fl.startY + (fl.targetY - fl.startY) * ease - Math.sin(t * Math.PI) * 26;
      fl.r = 7 + 5 * ease;
    });

    if (t < 1) {
      requestAnimationFrame(stepFly);
    } else {
      window.flyingVoteFlags = null;
      onComplete();
    }
  }
  requestAnimationFrame(stepFly);
}

function hexToRgb(hex) {
let c = (hex || "#ffffff").replace("#", "");
if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
return [
parseInt(c.slice(0, 2), 16),
parseInt(c.slice(2, 4), 16),
parseInt(c.slice(4, 6), 16)
];
}
function colorDistance(hex1, hex2) {
const [r1, g1, b1] = hexToRgb(hex1);
const [r2, g2, b2] = hexToRgb(hex2);
return Math.hypot(r1 - r2, g1 - g2, b1 - b2);
}
function getPaletteByCountryName(country) {
const rawName = (typeof country === "string" ? country : (country && country.name) || "").trim();
if (COUNTRY_FLAG_PALETTES[rawName]) return COUNTRY_FLAG_PALETTES[rawName];
const lower = rawName.toLowerCase();
const aliasMatch = COUNTRY_NAME_ALIASES[lower];
if (aliasMatch && COUNTRY_FLAG_PALETTES[aliasMatch]) {
return COUNTRY_FLAG_PALETTES[aliasMatch];
}
for (const key of Object.keys(COUNTRY_FLAG_PALETTES)) {
if (key.toLowerCase() === lower) return COUNTRY_FLAG_PALETTES[key];
}
return [(country && country.color) || "#ef4444", "#f8fafc", "#facc15"];
}
function getDistinctCountryColor(country, idx, usedColors) {
const basePalette = getPaletteByCountryName(country);
// Step 1: Pick the highest-priority flag color not yet used in this round
for (const flagHex of basePalette) {
const isTooClose = usedColors.some(used => colorDistance(flagHex, used) < 75);
if (!isTooClose) {
usedColors.push(flagHex);
return flagHex;
}
}
// Step 2: If all direct flag colors are taken (e.g. 3+ red/white flags in one round),
// pick a distinct shade directly from that country's flag color family
const expandedShades = [];
for (const flagHex of basePalette) {
const shades = FLAG_LINKED_SHADES[flagHex.toLowerCase()] || [flagHex];
for (const s of shades) {
if (!expandedShades.includes(s)) expandedShades.push(s);
}
}
let bestColor = expandedShades[0];
let bestMinDistance = -1;
for (const candidate of expandedShades) {
if (usedColors.includes(candidate)) continue;
const minDist = usedColors.length === 0
? 999
: Math.min(...usedColors.map(u => colorDistance(candidate, u)));
if (minDist >= 42) {
usedColors.push(candidate);
return candidate;
}
if (minDist > bestMinDistance) {
bestMinDistance = minDist;
bestColor = candidate;
}
}
usedColors.push(bestColor);
return bestColor;
}

function distPointToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, lenSq = dx * dx + dy * dy;
  if (lenSq === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

const _hdFlagCache = {};

function getHdFlagImage(country) {
  if (!country || !country.code) return null;
  const code = country.code.toLowerCase();
  if (_hdFlagCache[code]) return _hdFlagCache[code];
  const img = new Image(160, 160);
  const host = "cdn.jsdelivr.net";
  const path = "/gh/lipis/flag-icons@7.3.2/flags/1x1/";
  img.onerror = () => {
    if (!img._triedFallback) {
      img._triedFallback = true;
      img.src = "https://flagcdn.com" + code + ".png";
    }
  };
  img.src = "https://" + host + path + code + ".svg";
  _hdFlagCache[code] = img;
  return img;
}



// Switch between: "PULSE_CORE", "NEON", "COIN", "STUDIO", "3D", or "ORIGINAL"
const FLAG_STYLE = "PULSE_CORE";

function drawCircleFlag(country, x, y, r, borderCol) {
  const ringColor = borderCol || "#ffffff";
  ctx.save();

  if (FLAG_STYLE === "NEON" || FLAG_STYLE === "PULSE_CORE") {
    ctx.shadowColor = ringColor;
    ctx.shadowBlur = r * 0.45;
  } else if (FLAG_STYLE !== "ORIGINAL") {
    ctx.shadowColor = "rgba(0, 0, 0, 0.85)";
    ctx.shadowBlur = r * 0.25;
    ctx.shadowOffsetY = r * 0.1;
  }

  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = "#111827";
  ctx.fill();

  ctx.shadowColor = "transparent";
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
  ctx.clip();

  // Crisp HD flag (never stretched)
  const img = getHdFlagImage(country);
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    const ratio = img.naturalWidth / img.naturalHeight;
    let drawW = r * 2;
    let drawH = r * 2;
    if (ratio > 1.05) drawW = drawH * ratio;
    else if (ratio < 0.95) drawH = drawW / ratio;
    ctx.drawImage(img, x - drawW / 2, y - drawH / 2, drawW, drawH);
  } else {
    ctx.font = `${Math.round(r * 1.48)}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(country.flag, x, y + 1);
  }

  // Optional visual style overlays
  if (FLAG_STYLE === "COIN") {
    const coinRim = ctx.createRadialGradient(x, y, r * 0.78, x, y, r);
    coinRim.addColorStop(0, "rgba(0, 0, 0, 0)");
    coinRim.addColorStop(0.6, "rgba(255, 255, 255, 0.22)");
    coinRim.addColorStop(1, "rgba(0, 0, 0, 0.55)");
    ctx.fillStyle = coinRim;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  } else if (FLAG_STYLE === "STUDIO") {
    const studioGrad = ctx.createLinearGradient(x, y - r, x, y + r);
    studioGrad.addColorStop(0, "rgba(255, 255, 255, 0.14)");
    studioGrad.addColorStop(0.5, "rgba(0, 0, 0, 0)");
    studioGrad.addColorStop(1, "rgba(0, 0, 0, 0.28)");
    ctx.fillStyle = studioGrad;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  } else if (FLAG_STYLE === "3D") {
    const sphereShade = ctx.createRadialGradient(
      x - r * 0.15, y - r * 0.2, r * 0.35,
      x, y + r * 0.05, r
    );
    sphereShade.addColorStop(0, "rgba(0, 0, 0, 0)");
    sphereShade.addColorStop(0.68, "rgba(0, 0, 0, 0.12)");
    sphereShade.addColorStop(0.9, "rgba(0, 0, 0, 0.45)");
    sphereShade.addColorStop(1, "rgba(0, 0, 0, 0.78)");
    ctx.fillStyle = sphereShade;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  ctx.restore();

  // Crisp Outer Border Ring
  ctx.save();
    if (FLAG_STYLE === "PULSE_CORE") {
    // Thin inner dark gap ring
    ctx.beginPath();
    ctx.arc(x, y, r - Math.max(0.7, r * 0.025), 0, Math.PI * 2);
    ctx.lineWidth = Math.max(1.1, r * 0.05);
    ctx.strokeStyle = "#090d16";
    ctx.stroke();

    // Sleek outer glowing energy ring
    ctx.shadowColor = ringColor;
    ctx.shadowBlur = Math.max(6, r * 0.38);
    ctx.beginPath();
    ctx.arc(x, y, r + Math.max(0.4, r * 0.015), 0, Math.PI * 2);
    ctx.lineWidth = Math.max(1.1, r * 0.052);
    ctx.strokeStyle = ringColor;
    ctx.stroke();
  } else {

    if (FLAG_STYLE === "NEON") {
      ctx.shadowColor = ringColor;
      ctx.shadowBlur = Math.max(6, r * 0.35);
    }
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.lineWidth = Math.max(1.5, r * 0.075);
    ctx.strokeStyle = ringColor;
    ctx.stroke();
  }
  ctx.restore();
}






const fxParticles = new Array();

function breakStringIntoPieces(hitX, hitY, x1, y1, x2, y2, color) {
  if (fxParticles.length > 260) fxParticles.splice(0, 40);
  const lineAngle = Math.atan2(y2 - y1, x2 - x1);

  for (let i = 0; i < 8; i++) {

    const spd = 1.6 + Math.random() * 3.6;
    fxParticles.push({
      kind: "linePiece",
      x: hitX,
      y: hitY,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd,
      len: 1.2 + Math.random() * 1.8,
      rot: lineAngle + (Math.random() - 0.5) * 0.8,
      vrot: (Math.random() - 0.5) * 0.35,
      life: 1.0,
      color: i < 2 ? "#ffffff" : color
    });
  }

  for (let s = 0.15; s <= 0.90; s += 0.15) {
    const px = x1 + (x2 - x1) * s;
    const py = y1 + (y2 - y1) * s;
    const perp = lineAngle + (Math.random() < 0.5 ? Math.PI * 0.5 : -Math.PI * 0.5);
    const spd = 0.7 + Math.random() * 1.8;
    fxParticles.push({
      kind: "linePiece",
      x: px,
      y: py,
      vx: Math.cos(perp) * spd,
      vy: Math.sin(perp) * spd,
      len: 1.4 + Math.random() * 2.0,
      rot: lineAngle,
      vrot: (Math.random() - 0.5) * 0.28,
      life: 0.95,
      color
    });
  }
}

function addBallShatter(fighter) {
  const totalPieces = 48;
  for (let i = 0; i < totalPieces; i++) {
    const ang = (i / totalPieces) * Math.PI * 2 + (Math.random() - 0.5) * 0.25;
    const isOuterRing = i % 2 === 0;
    const spd = isOuterRing ? (3.2 + Math.random() * 5.2) : (1.2 + Math.random() * 3.0);
    fxParticles.push({
      kind: "shard",
      x: fighter.x + (Math.random() - 0.5) * 6,
      y: fighter.y + (Math.random() - 0.5) * 6,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 1.4,
      w: 3.5 + Math.random() * 4.5,
      h: 3.0 + Math.random() * 4.0,
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.45,
      life: 1.15,
      color: i % 4 === 0 ? "#ffffff" : (i % 4 === 1 ? "#facc15" : fighter.country.color)
    });
  }
}


function drawAndStepFx() {
  for (let i = fxParticles.length - 1; i >= 0; i--) {
    const p = fxParticles.at(i);
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vrot;
    if (p.kind === "shard") {
      p.vy += 0.15;
      p.life -= 0.022;
    } else {
      p.vx *= 0.95;
      p.vy *= 0.95;
      p.life -= 0.042;
    }
    if (p.life <= 0) {
      fxParticles.splice(i, 1);
      continue;
    }
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    if (p.kind === "shard") {
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w * 0.5, -p.h * 0.5, p.w, p.h);
    } else {
      ctx.strokeStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 3;
      ctx.lineWidth = 0.85;
      ctx.beginPath();
      ctx.moveTo(-p.len * 0.5, 0);
      ctx.lineTo(p.len * 0.5, 0);
      ctx.stroke();
    }
    ctx.restore();
  }
}

        const stepGap = 0.30;
        const jumpDur = 1.20;

        if (typeof window.revealLaunchedCount !== "number") window.revealLaunchedCount = 0;

        // 1. Trigger Jump Whoosh at the exact moment each flag leaves the vote bar
        for (let j = window.revealLaunchedCount; j < totalJumpers; j++) {
          if (window.revealJumpElapsed >= j * stepGap) {
            window.revealLaunchedCount = j + 1;
            if (typeof playFlagJumpSound === "function") playFlagJumpSound(j);
          }
        }

        // 2. Trigger Sit Lock-In + Chime at the exact moment each flag lands in its slot
        for (let j = window.revealLandedCount; j < totalJumpers; j++) {
          if (window.revealJumpElapsed >= j * stepGap + jumpDur) {
            window.revealLandedCount = j + 1;
            if (typeof playFlagSitChime === "function") playFlagSitChime(j);
          }
        }

        const allLandedTime = totalJumpers > 0 ? ((totalJumpers - 1) * stepGap + jumpDur) : 0.2;
        if (window.revealJumpElapsed >= allLandedTime + 0.65) {
          window.revealJumpStarted = false;
          window.revealJumpElapsed = 0;
          window.revealLaunchedCount = 0;
          window.revealLandedCount = 0;
          const flyLayer = document.getElementById("fly-flags-layer");
          if (flyLayer) flyLayer.innerHTML = "";
          startShrinkToBattle();
        }

      } else if (gameState === "DEPLOY") {




  if (!window.finalWarIntroActive) {
    deployProgress += dt * 1.65;
    if (deployProgress >= 1) {
      deployProgress = 1;
      gameState = "BATTLE";
    }
  }
    } else if (gameState === "BATTLE") {
      if (bannerText && stateTimer > 0) {
        stateTimer -= dt;
        if (stateTimer <= 0) { bannerText = ""; bannerSub = ""; eliminatedCountryObj = null; }
      }
      updateBattle();
    } else if (gameState === "ROUND_END") {
      winAnimProgress += dt *3.0;
      if (stateTimer > 1.2 && Math.random() < 0.14) {
        const cols = ["#ff2a85", "#00f0ff", "#ffd700", "#00ff66", "#b829ff", "#ffffff"];
        confettiParticles.push({
          x: CX + (Math.random() - 0.5) * 140,
          y: CY - 30,
          vx: (Math.random() - 0.5) * 7,
          vy: -2.5 - Math.random() * 4.5,
          size: 5 + Math.random() * 5,
          color: cols.at(Math.floor(Math.random() * cols.length)),
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 0.25
        });
      }
      for (const c of confettiParticles) {
        c.x += c.vx;
        c.y += c.vy;
        c.vy += 0.12;
        c.rot += c.vrot;
      }
      stateTimer -= dt;
      if (stateTimer <= 0) {
      if (window.isFinalWar) {
    window.isFinalWar = false;
    const survivor = fighters.find(f => !f.eliminated);
    window.finalWarChampion = survivor ? survivor.country : null;
    gameState = "GRAND_CHAMP";
    triggerGrandChampion();
    const winnerName = survivor?.country?.name || "Champion";
    speakWarVoice(`Congratulations! ${winnerName} is the Grand Champion!`, true);
      } else if (champSecondsLeft <= 0 && !window.finalWarQueued) {
    window.finalWarQueued = true;

    const top5Winners = Object.entries(champWins || {})
      .filter(([, wins]) => wins > 0)
      .sort((a, b) => b[1] - a[1])
      .map(([name]) => getCountryByName(name))
      .filter(c => c && c.name); // Removes any undefined/invalid country entries!

    const fallbackPool = COUNTRIES.filter(
      c => c && c.name && !top5Winners.some(t => t.name === c.name)
    );
    const finalPool = [...top5Winners, ...fallbackPool].slice(0, 5);

    // 1-second pause after the 10-minute final round before launching FINAL WAR
    setTimeout(() => {
      window.finalWarQueued = false;
      startFinalWarSequence(finalPool);
    }, 1000);
  } else if (champSecondsLeft > 0) {
    prepareNextRound();
  }

}

}
} catch (err) {
  console.error(err);
}

      draw();
    requestAnimationFrame(loop);
  }
  setInterval(() => {
  if (window.isGamePaused) return;
  if (gameState === "GRAND_CHAMP" || gameState === "HOF") return;
  if (champSecondsLeft > 0) champSecondsLeft--;
  const m = String(Math.floor(champSecondsLeft / 60)).padStart(2, "0");
  const s = String(champSecondsLeft % 60).padStart(2, "0");
  document.getElementById("champ-timer").textContent = `${m}:${s}`;
}, 1000);
document.body.addEventListener("click", () => {
  if (audioCtx.state === "suspended") audioCtx.resume();
}, { once: true });
resize();
startNewChampionship();
requestAnimationFrame(loop);
window.isGamePaused = false;

function toggleGamePause() {
  window.isGamePaused = !window.isGamePaused;
  const btn = document.getElementById("pause-btn");
  if (btn) btn.textContent = window.isGamePaused ? "▶" : "⏸";
  if (window.isGamePaused && typeof voicePlayer !== "undefined") {
    try { voicePlayer.pause(); } catch (e) {}
  }
}

function setTermuxConnected(connected) {
  const dot = document.getElementById("termux-dot");
  if (!dot) return;
  dot.style.background = connected ? "#22c55e" : "#ef4444";
  dot.style.boxShadow = connected ? "0 0 8px #22c55e" : "0 0 8px #ef4444";
}

// Automatically monitor Termux chat.py server (http://localhost:7700) every 2 seconds
setInterval(async () => {
  try {
    const res = await fetch("http://localhost:7700/votes", { cache: "no-store" });
    setTermuxConnected(res.ok);
  } catch (e) {
    setTermuxConnected(false);
  }
}, 2000);
</script>
<script>
function lockBgToWheel() {
  const wheel = document.querySelector('canvas');
  const bg = document.getElementById('bg-aesthetic');
  if (!wheel || !bg) return;
  const r = wheel.getBoundingClientRect();
  bg.style.setProperty('--cx', (r.left + r.width / 2) + 'px');
  bg.style.setProperty('--cy', (r.top + r.height / 2) + 'px');
}
window.addEventListener('load', lockBgToWheel);
window.addEventListener('resize', lockBgToWheel);
setTimeout(lockBgToWheel, 300);
</script>
